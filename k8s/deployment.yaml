apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediplus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediplus
  template:
    metadata:
      labels:
        app: mediplus
    spec:
      containers:
        - name: mediplus
          image: alanjose2929/mediplus:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mediplus
spec:
  type: NodePort
  selector:
    app: mediplus
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30082
